<section id="contact">
    <div class="section-header">
        <span class="tagline">Vamos Trabalhar Juntos</span>
        <h2>Entre em CONTATO</h2>
        <div class="divider"></div>
    </div>

    <div class="contact-container">
        <div class="contact-info-col">
            <div class="availability-card">
                <div class="availability-header">
                    <svg class="signal-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path class="signal-ring inner" d="M8.5 8.5a5 5 0 0 1 7 0"></path>
                        <path class="signal-ring outer" d="M5 5a10 10 0 0 1 14 0"></path>
                    </svg>
                    <h3>Disponível para Projetos</h3>
                </div>
                <p>Tem algum projeto em mente, proposta ou dúvida? Envie uma mensagem e entrarei em contacto o mais breve possível.</p>
            </div>

            <div class="contact-item">
                <div class="contact-icon"><i class="fas fa-envelope"></i></div>
                <div class="contact-text">
                    <span>E-mail</span>
                    <a href="mailto:joseizataquinvula885@gmail.com">joseizataquinvula885@gmail.com</a>
                </div>
            </div>

            <div class="contact-item">
                <div class="contact-icon"><i class="fas fa-phone-alt"></i></div>
                <div class="contact-text">
                    <span>Telefone</span>
                    <a href="tel:+244955403072">+244 955 403 072</a>
                </div>
            </div>

            <div class="contact-item">
                <div class="contact-icon"><i class="fas fa-map-marker-alt"></i></div>
                <div class="contact-text">
                    <span>Localização</span>
                    <p>Luanda, Angola</p>
                </div>
            </div>
        </div>

        <div class="contact-form-card">
            <form class="contact-form">
                <div class="form-group">
                    <input type="text" name="nome" placeholder="Seu Nome" autocomplete="off" required>
                    <div class="error-icon"><i class="fas fa-exclamation"></i></div>
                </div>

                <div class="form-group">
                    <input type="email" name="email" placeholder="Seu E-mail" autocomplete="off" required>
                    <div class="error-icon"><i class="fas fa-exclamation"></i></div>
                </div>

                <div class="form-group">
                    <textarea name="mensagem" placeholder="Sua Mensagem" rows="6" autocomplete="off" required></textarea>
                    <div class="error-icon"><i class="fas fa-exclamation"></i></div>
                </div>

                <input type="text" name="_honey" style="display:none">

                <button type="submit" class="btn-submit">
                    Enviar Mensagem <i class="fas fa-paper-plane"></i>
                </button>
            </form>
            <div id="toast-container"></div>
        </div>
    </div>
</section>
