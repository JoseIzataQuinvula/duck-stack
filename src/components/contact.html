<section id="contact">
    <div class="section-header">
        <span class="tagline">Vamos Trabalhar Juntos</span>
        <h2>Entre em CONTATO</h2>
        <div class="divider"></div>
    </div>

    <div class="contact-container">
        <div class="contact-info-col">
            <div class="contact-item">
                <div class="contact-icon"><i class="fas fa-envelope"></i></div>
                <div class="contact-text">
                    <span>E-mail</span>
                    <a href="mailto:joseizataquinvula885@gmail.com">joseizataquinvula885@gmail.com</a>
                </div>
            </div>

            <div class="contact-item">
                <div class="contact-icon"><i class="fas fa-phone-alt"></i></div>
                <div class="contact-text">
                    <span>Telefone</span>
                    <a href="tel:+244955403072">+244 955 403 072</a>
                </div>
            </div>

            <div class="contact-item">
                <div class="contact-icon"><i class="fas fa-map-marker-alt"></i></div>
                <div class="contact-text">
                    <span>Localização</span>
                    <p>Luanda, Angola</p>
                </div>
            </div>

            <div class="contact-socials">
                <span>Redes Sociais</span>
                <div class="social-links-grid">
                    <a href="https://www.linkedin.com/in/jos%C3%A9-izata-quinvula-9287a3389/" target="_blank" class="social-box">
                        <i class="fab fa-linkedin-in"></i>
                    </a>
                    <a href="https://github.com/JoseIzataQuinvula" target="_blank" class="social-box">
                        <i class="fab fa-github"></i>
                    </a>
                    <a href="https://www.facebook.com/jose.izata.quinvula/" target="_blank" class="social-box">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <a href="https://www.instagram.com/joseizataquinvula/" target="_blank" class="social-box">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="https://www.tiktok.com/@joseizataquinvula" target="_blank" class="social-box">
                        <i class="fab fa-tiktok"></i>
                    </a>
                </div>
            </div>
        </div>

        <div class="contact-form-card">
            <form class="contact-form">
                <div class="form-group">
                    <input type="text" name="nome" placeholder="Seu Nome" autocomplete="off" required>
                    <div class="error-icon"><i class="fas fa-exclamation"></i></div>
                </div>

                <div class="form-group">
                    <input type="email" name="email" placeholder="Seu E-mail" autocomplete="off" required>
                    <div class="error-icon"><i class="fas fa-exclamation"></i></div>
                </div>

                <div class="form-group">
                    <textarea name="mensagem" placeholder="Sua Mensagem" rows="6" autocomplete="off" required></textarea>
                    <div class="error-icon"><i class="fas fa-exclamation"></i></div>
                </div>

                <input type="text" name="_honey" style="display:none">

                <button type="submit" class="btn-submit">
                    Enviar Mensagem <i class="fas fa-paper-plane"></i>
                </button>
            </form>
            <div id="toast-container"></div>
        </div>
    </div>
</section>
