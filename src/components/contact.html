<section id="contact">
    <div class="section-header">
        <span class="tagline">Vamos Trabalhar Juntos</span>
        <h2>Entre em CONTATO</h2>
        <div class="divider"></div>
    </div>

    <div class="contact-wrapper">
        <div class="contact-info-card">
            <h3>Informações de Contacto</h3>
            <p>Tem algum projeto em mente, proposta ou dúvida? Envie uma mensagem e entrarei em contacto o mais breve possível.</p>
            <ul class="contact-details">
                <li><i class="fas fa-envelope"></i> joseizataquinvula885@gmail.com</li>
                <li><i class="fas fa-phone-alt"></i> +244 955 403 072</li>
                <li><i class="fas fa-map-marker-alt"></i> Luanda, Angola</li>
            </ul>
        </div>

        <div class="contact-form-card">
            <form class="contact-form">
                <div class="form-group">
                    <input type="text" name="nome" placeholder="Seu Nome" autocomplete="off" required>
                    <div class="error-icon"><i class="fas fa-exclamation"></i></div>
                </div>

                <div class="form-group">
                    <input type="email" name="email" placeholder="Seu E-mail" autocomplete="off" required>
                    <div class="error-icon"><i class="fas fa-exclamation"></i></div>
                </div>

                <div class="form-group">
                    <textarea name="mensagem" placeholder="Sua Mensagem" rows="6" autocomplete="off" required></textarea>
                    <div class="error-icon"><i class="fas fa-exclamation"></i></div>
                </div>

                <input type="text" name="_honey" style="display:none">

                <button type="submit" class="btn-submit">
                    Enviar Mensagem <i class="fas fa-paper-plane"></i>
                </button>
            </form>
            <div id="toast-container"></div>
        </div>
    </div>
</section>
