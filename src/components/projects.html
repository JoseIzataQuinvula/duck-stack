<section id="projects">

        <h2>Projetos em Destaque</h2>
        <div class="divider"></div>
    </div>

    <div class="projects-grid">
        <article id="projeto1" class="project-card" onclick="toggleProject(this)">
            <div class="project-img">
                <img src="assets/img/projetos/ageux-capa.webp"

            <div class="project-content">
